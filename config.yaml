# 会議設定
# このファイルを編集して、音声認識の精度をチューニングできます

# 参加者名（タスク抽出の担当者候補として使用）
# 参加者名はキータームにも自動追加され、名前の認識精度が上がります
participants:
  - 田中
  - 鈴木
  - 佐藤

# 音声認識のキーターム
# 会議で出てくる専門用語・プロジェクト名・ブランド名を指定すると認識精度が上がります
# 上限: 全キータームで合計500トークン（20〜50語が目安）
keyterms:
  - AI-Driven School
  - Deepgram
  - Linear
  - Slack

# 認識後の置換ルール（任意）
# 既知の誤変換パターンを修正します
# keyterms で解決しない場合の補助手段です
replacements:
  - find: 深グラム
    replace: Deepgram
